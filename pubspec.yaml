name: fazal_portfolio
description: Professional portfolio of Fazal-e-Haq — Flutter Developer & UI/UX Designer.
publish_to: 'none'
version: 2.0.0+1

# ── SDK Constraint ──────────────────────────────────────────────────────────
# Requires Dart 3.12+ (Flutter 3.44+) for latest language features.
environment:
  sdk: '>=3.12.0 <4.0.0'

# ── Dependencies ────────────────────────────────────────────────────────────
dependencies:
  flutter:
    sdk: flutter

  # State Management
  get: ^4.7.3

  # UI & Animation
  animated_text_kit: ^4.3.0     # Typewriter, scramble, and typer text animations
  auto_size_text: ^3.0.0        # Auto-scaling text for responsive layouts
  cupertino_icons: ^1.0.9       # iOS-style icon font for CupertinoIcons

  # Utilities
  url_launcher: ^6.3.2          # Opens URLs, emails, and external links
  web: ^1.1.0                   # Web-specific APIs (sessionStorage, etc.)
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0         # Recommended lint rules for Flutter

# ── Flutter Configuration ───────────────────────────────────────────────────
flutter:
  uses-material-design: true

  # Assets — images, PDFs, and other static resources
  assets:
    - assets/Images/works/cutcount/
    - assets/Images/my-filter-pic/full-preview.jpeg
    - assets/Images/my-filter-pic/black-full.jpeg
    - assets/Fazal-Resume.pdf

  # Custom Fonts — brand typography
  fonts:
    - family: Poppins
      fonts:
        - asset: assets/fonts/poppins/Poppins-Regular.ttf
    - family: Unbounded
      fonts:
        - asset: assets/fonts/unbounded/Unbounded-Regular.ttf
